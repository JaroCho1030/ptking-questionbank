# 打 tag（例如 v2026.10.16-1）就自動 build 題庫並發 GitHub Release。
# App 固定抓 https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
# tag 以 -test 結尾（例如 v2026.10.24-1-test）發成 pre-release，latest 不會指到它（App 的 debug 測試通道用）。
name: release-questionbank
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.validate --strict
      - name: build
        # tag 名稱（github.ref_name）可含 shell 特殊字元，一律先進 env 再用 "$VAR" 引用，
        # 不要在 run: 裡直接內插 ${{ }}，避免惡意 tag 注入指令。
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${REF_NAME#v}"
          python -m pipeline.build --version "$VERSION" \
            --release-base-url "https://github.com/${GH_REPO}/releases/download/${REF_NAME}"
      - name: release notes
        # 這時 latest 還是上一版；抓不到（第一版）就當第一版
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if curl -fsSL -o prev_manifest.json "https://github.com/${GH_REPO}/releases/latest/download/manifest.json"; then
            python -m pipeline.release_notes --previous-manifest prev_manifest.json
          else
            python -m pipeline.release_notes
          fi
          echo "BANK_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: 物理治療師國考題庫 ${{ env.BANK_VERSION }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ endsWith(github.ref_name, '-test') }}
          files: |
            dist/questions.sqlite
            dist/manifest.json
