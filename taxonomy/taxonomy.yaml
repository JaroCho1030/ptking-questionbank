  - code: NEURO
    name: 神經疾病物理治療學
    full_name: 神經疾病物理治療學
    short_name: 神經
    topics:
      - code: NEURO-FOUND
        name: 神經肌肉系統基礎與原理（含神經解剖生理基礎、動作控制、動作學習、神經可塑性）
        definition: 神經解剖生理基礎（感覺傳導徑、外側抑制、感覺聯合區、皮節、腦神經、小腦分區）、動作控制理論、動作學習（回饋、練習排程）、神經可塑性、肌梭與反射。
        excludes:
          - 單純問周邊神經支配範圍 → NEURO-PNI，次要主題加 BASIC-ANA-NEU
        keywords: [神經解剖, 感覺傳導徑, 外側抑制, 感覺聯合區, 皮節, 腦神經, 小腦分區, 動作控制理論, 動作學習, 回饋, 練習排程, 神經可塑性, 肌梭, 反射]
      - code: NEURO-ASSESS
        name: 神經評估與量表（張力、平衡、協調、認知、ICF）
        definition: 所有量表的內容與計分（Berg、TUG、Ashworth、Fugl-Meyer、GCS、Rancho Los Amigos、Brunnstrom 分期、Kurtzke）、協調測試、感覺檢查、ICF。
        keywords: [Berg, TUG, Ashworth, Fugl-Meyer, GCS, Rancho, ICF, 協調測試, 感覺檢查, Brunnstrom 分期, 恢復分期]
      - code: NEURO-APPROACH
        name: 治療學派與技術（NDT、PNF、Brunnstrom、任務導向、CIMT、Rood）
        definition: NDT、PNF（含動作型態：雙側對稱／非對稱、交替）、Brunnstrom 治療技術、Rood 與動作控制階段（controlled mobility 等）、任務導向、CIMT、動作再學習、穿戴式機器人與虛擬實境訓練。
        excludes:
          - Brunnstrom 分期 → NEURO-ASSESS
        keywords: [NDT, PNF, Brunnstrom 治療技術, 任務導向, 限制誘發, 肌肉再教育, 動作再學習, Rood, 動作控制階段, controlled mobility, PNF 動作型態, 雙側對稱, 雙側非對稱, 交替性]
      - code: NEURO-BALANCE
        name: 平衡與姿勢控制
        definition: 平衡訓練、姿勢控制、支持底面積與質量中心、預期性與反應性平衡、雙項任務、感覺整合、沒有指定疾病的坐到站與重量轉移。
        excludes:
          - 平衡量表 → NEURO-ASSESS
          - 題目指定疾病的功能訓練（如中風患者坐到站）→ 該疾病主題
        keywords: [平衡訓練, 姿勢控制, 支持底面積, 質量中心, 預期性平衡, 反應性平衡, 雙項任務, 靜態平衡, 動態平衡, 坐站, 感覺整合]
      - code: NEURO-STROKE
        name: 腦中風
        definition: 中風的病理、症狀（偏癱、失語、忽略、肩痛）與物理治療，包括中風患者的步態、轉位、坐到站訓練。
        excludes:
          - 量表 → NEURO-ASSESS
        keywords: [中風, 偏癱, 中大腦動脈, 失語, 忽略, 肩痛, 步態訓練, 轉位訓練, 坐到站訓練]
      - code: NEURO-TBI
        name: 創傷性腦傷
        definition: 創傷性腦傷的病理（腦脫垂、去大腦／去皮質僵直）、認知與行為問題、物理治療。
        excludes:
          - GCS、Rancho 等量表 → NEURO-ASSESS
        keywords: [TBI, 腦脫垂, 去大腦僵直, 失憶, 認知, 去皮質]
      - code: NEURO-SCI
        name: 脊髓損傷
        definition: ASIA 分類、完全與不完全損傷、自主神經反射異常、呼吸、轉位與輪椅訓練。
        keywords: [SCI, ASIA, 完全性, 不完全性, 自主神經反射異常, 轉位, 輪椅]
      - code: NEURO-PD
        name: 巴金森氏病
        definition: 巴金森氏病的症狀、Hoehn & Yahr 分期、凍結步態、藥物（左旋多巴）、線索策略。
        keywords: [巴金森, Hoehn & Yahr, 凍結步態, 左旋多巴, 線索策略]
      - code: NEURO-MS
        name: 多發性硬化症
        definition: 多發性硬化症的病程、疲勞、Uhthoff 與 Lhermitte 現象、復發。
        excludes:
          - Kurtzke 量表 → NEURO-ASSESS
        keywords: [MS, 疲勞, Uhthoff, Lhermitte, 復發]
      - code: NEURO-MND
        name: 運動神經元疾病（ALS）
        definition: 肌萎縮性脊髓側索硬化症等運動神經元疾病、延髓症狀與呼吸問題。
        keywords: [ALS, 運動神經元, 延髓, 呼吸]
      - code: NEURO-BG-CB
        name: 基底核與小腦其他疾患（亨丁頓、威爾森、運動失調）
        definition: 亨丁頓舞蹈症、威爾森氏症、小腦運動失調、肌張力不全，以及 Frenkel 運動等協調訓練。
        excludes:
          - 巴金森氏病 → NEURO-PD
        keywords: [亨丁頓, 威爾森, 小腦, 運動失調, 舞蹈症, 肌張力不全]
      - code: NEURO-DEMENTIA
        name: 失智症與認知功能
        definition: 失智症、阿茲海默症、認知功能與記憶分類、MMSE 等認知評估的應用。
        keywords: [失智, 阿茲海默, MMSE, 認知, 行為]
      - code: NEURO-TUMOR
        name: 腦瘤
        definition: 腦瘤種類（膠質瘤等）、放射治療、影像與物理治療。
        keywords: [腦瘤, 膠質瘤, 放射治療, 影像]
      - code: NEURO-INFECTION
        name: 神經系統感染（腦膜炎、腦炎、HIV 等）
        definition: 腦膜炎、腦炎、HIV、帶狀疱疹等中樞神經系統感染與物理治療。
        keywords: [腦膜炎, 腦炎, HIV, 帶狀疱疹, 中樞神經感染]
      - code: NEURO-PNI
        name: 周邊神經損傷與神經肌肉疾病（GBS、顏面神經、小兒麻痺、肌肉失養症）
        definition: 周邊神經損傷與分級（Sunderland）、周邊神經支配範圍、GBS、顏面神經麻痺、小兒麻痺與後小兒麻痺、肌肉失養症、周邊神經病變。
        keywords: [GBS, Sunderland, Bell, 小兒麻痺, 後小兒麻痺, 裘馨氏, 周邊神經病變]
      - code: NEURO-VESTIB
        name: 前庭疾病與平衡復健
        definition: BPPV、梅尼爾氏症、眼震、前庭眼反射、Dix-Hallpike 與 Epley 等前庭復健。
        keywords: [BPPV, 前庭, 眼震, Dix-Hallpike, Epley, 前庭眼反射, 梅尼爾]
      - code: NEURO-GERI
        name: 老人物理治療與連續性照護
        definition: 老化的動作控制改變、跌倒、衰弱、肌少症、老人體適能、運動動機、長照與連續性照護。
        keywords: [老化, 跌倒, 衰弱, 肌少症, 體適能, 長照, 運動動機]

  - code: ORTHO
    name: 骨科疾病物理治療學
    full_name: 骨科疾病物理治療學
    short_name: 骨科
