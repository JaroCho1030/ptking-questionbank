# 我要成為物治王 — 主題分類表（v1，2026-10-18 定稿；2026-10-19 調整後共 100 個主題，並加上 definition / excludes）
#
# 給人看的版本：docs/TAXONOMY.md（由這個檔產生：python -m pipeline.taxonomy_doc，請勿手改 md）
#
# 骨架來源：考選部「專門職業及技術人員高等考試物理治療師考試命題大綱暨參考用書」
#   115/03/13 公告（自 115 年第二次考試起實施；僅修正技術學大綱，科目名稱與 109 年版相同，
#   因此同一套分類表可回溯套用到 105 年起的全部考題）。
#
# 規則：
#   - 每題恰好一個 topic（主要主題），另可掛 0~2 個 secondary_topics 與 0~3 個 tags（自由標籤，例如 "Berg", "ICF"）。
#     歸類通則見 docs/ARCHITECTURE.md 3.8。
#   - topic code 格式：{SUBJECT}-{TOPIC}，全大寫，App 與題庫以 code 為鍵，name 只用於顯示。
#   - 每個 topic 欄位：code、name（App 顯示）、group（選填，同科分組）、definition（包含什麼）、
#     excludes（選填，容易混淆但要歸別處的內容，寫成「內容 → 該歸的 code」）、keywords。
#   - definition、excludes、keywords 會放進 LLM 標記的提示詞，也會產生到 docs/TAXONOMY.md，不會進 App。
#   - 改了 definition / excludes / keywords / name 之後要重跑 python -m pipeline.taxonomy_doc（測試會檢查是否同步）。
#   - 修改 name 不影響資料；修改 code 要同步改 data/json 裡已標記的題目（pipeline/tag.py --remap）。
#   - 新增 topic 直接加在該科 topics 底下；刪除前先確認沒有題目使用。
#
# 科目代碼（固定，對應考選部科目名稱；題目 ID 用這個）：
#   BASIC   物理治療基礎學（包括解剖學、生理學、肌動學與生物力學）
#   INTRO   物理治療學概論（包括物理治療史、物理治療倫理學與物理治療行政管理學）
#   TECH    物理治療技術學（包括電療學、熱療學、操作治療學與輔具學）
#   NEURO   神經疾病物理治療學
#   ORTHO   骨科疾病物理治療學
#   CARDPED 心肺疾病與小兒疾病物理治療學

version: 1
updated: 2026-10-19

subjects:
  - code: BASIC
    name: 物理治療基礎學
    full_name: 物理治療基礎學（包括解剖學、生理學、肌動學與生物力學）
    short_name: 基礎學
    topics:
      - code: BASIC-ANA-MSK
        name: 肌肉骨骼系統解剖學（構造、位置、起止點、神經支配）
        group: 解剖學
        definition: 骨骼、肌肉、韌帶、關節的構造與位置：起止點、神經支配、血液供應、關節組成與軟骨分類。
        excludes:
          - 肌肉在動作中的功能、關節穩定與力學（足弓基石、單腳站立誰在固定）→ 該部位的 KIN 主題
        keywords: [骨骼, 肌肉起止點, 韌帶, 關節構造, 關節組成, 軟骨分類, 神經支配, 血液供應]
      - code: BASIC-ANA-NEU
        name: 神經系統解剖學
        group: 解剖學
        definition: 腦、脊髓、腦神經與周邊神經的構造、傳導路徑、皮節與肌節。
        excludes:
          - 神經訊號的產生與傳遞（動作電位、突觸）→ BASIC-PHY-NEU
        keywords: [腦, 脊髓, 腦神經, 周邊神經, 傳導路徑, 皮節, 肌節]
      - code: BASIC-ANA-CP
        name: 呼吸循環系統解剖學
        group: 解剖學
        definition: 心臟、血管、肺、氣道、縱膈與冠狀動脈的構造與位置。
        excludes:
          - 心輸出量、血壓調控、氣體交換等功能 → BASIC-PHY-CP
        keywords: [心臟, 血管, 肺, 氣道, 縱膈, 冠狀動脈]
      - code: BASIC-ANA-OTH
        name: 其他系統解剖學
        group: 解剖學
        definition: 消化、泌尿、生殖、內分泌、皮膚系統的構造，以及胚胎發育。
        keywords: [消化, 泌尿, 生殖, 內分泌, 皮膚, 胚胎]
      - code: BASIC-PHY-MSK
        name: 肌肉骨骼系統生理學（含肌肉收縮機制、骨骼肌與運動時的能量代謝）
        group: 生理學
        definition: 肌肉收縮機制（橫橋、離心收縮的機制、長度－張力關係）、肌纖維型態、骨骼肌與運動時的能量系統（ATP、乳酸、脂肪氧化）、骨代謝。
        excludes:
          - 某個動作由哪條肌肉、哪種收縮型態完成 → BASIC-KIN-ANALYSIS 或該部位的 KIN 主題
          - 心肌的能量代謝 → BASIC-PHY-CP
          - 蛋白質、維生素等一般營養代謝 → BASIC-PHY-OTH
        keywords: [肌肉收縮, 橫橋, 離心收縮機制, 長度張力關係, 肌纖維型態, 能量系統, ATP, 乳酸, 脂肪氧化, 骨代謝]
      - code: BASIC-PHY-NEU
        name: 神經內分泌系統生理學
        group: 生理學
        definition: 動作電位、突觸、反射、感覺受器、自主神經與荷爾蒙的作用。
        keywords: [動作電位, 突觸, 反射, 感覺受器, 荷爾蒙, 自主神經]
      - code: BASIC-PHY-CP
        name: 呼吸循環系統生理學（含心肌能量代謝）
        group: 生理學
        definition: 心輸出量、血壓調控、氣體交換、肺容積、血液，以及心肌的能量代謝。
        keywords: [心輸出量, 血壓調控, 氣體交換, 肺容積, 血液, 心肌代謝]
      - code: BASIC-PHY-OTH
        name: 其他系統生理學（含一般營養代謝）
        group: 生理學
        definition: 消化、腎臟、酸鹼平衡、體溫、免疫、皮膚生理，以及蛋白質、維生素等一般營養代謝。
        excludes:
          - 骨骼肌與運動時的能量來源 → BASIC-PHY-MSK
        keywords: [消化, 腎臟, 酸鹼平衡, 體溫, 免疫, 皮膚, 蛋白質代謝, 維生素, 營養代謝]
      - code: BASIC-PHY-EX
        name: 運動生理學、發展與老化
        group: 生理學
        definition: 最大攝氧量、訓練適應、疲勞、臥床去適能，以及生長發育與老化的生理變化。
        keywords: [最大攝氧量, 訓練適應, 疲勞, 發展, 老化生理]
      - code: BASIC-KIN-THEORY
        name: 肌動學與生物力學理論
        group: 肌動學與生物力學
        definition: 力矩、槓桿、牛頓定律、骨運動學與關節運動學（凹凸法則）等不限部位的力學原理，以及肌肉型態與力量的關係（羽狀肌、生理截面積）。
        excludes:
          - 特定部位的肌動學 → BASIC-KIN-UE／LE／SPINE
        keywords: [力矩, 槓桿, 牛頓定律, 關節運動學, 骨運動學, 凹凸法則]
      - code: BASIC-KIN-UE
        name: 上肢肌動學
        group: 肌動學與生物力學
        definition: 肩胛肱骨節律、肘、前臂、腕、手與抓握的運動與上肢肌肉功能。
        excludes:
          - 只問構造、起止點、神經支配 → BASIC-ANA-MSK
        keywords: [肩胛肱骨節律, 肘, 前臂, 腕, 手, 抓握, 上肢肌肉功能]
      - code: BASIC-KIN-LE
        name: 下肢肌動學
        group: 肌動學與生物力學
        definition: 髖、膝、踝、足的運動與穩定：足弓與足弓基石、單腳站立、螺旋回返、Q 角與下肢肌肉功能。
        excludes:
          - 只問構造、起止點、神經支配 → BASIC-ANA-MSK
          - 步態週期 → BASIC-KIN-GAIT
        keywords: [髖, 膝, 踝, 足弓, 足弓基石, 單腳站立, 螺旋回返, Q角, 下肢肌肉功能]
      - code: BASIC-KIN-SPINE
        name: 頭頸軀幹肌動學
        group: 肌動學與生物力學
        definition: 脊椎、椎間盤、顳頷關節、骨盆與呼吸肌的運動，包括耦合動作與小面關節的滑動方向。
        keywords: [脊椎, 椎間盤, 顳頷關節, 骨盆, 呼吸肌, 耦合動作]
      - code: BASIC-KIN-GAIT
        name: 步態與姿態
        group: 肌動學與生物力學
        definition: 步態週期與各期肌肉活動、步態決定因子、跑步分期、站姿與姿勢、重心與壓力中心。
        keywords: [步態週期, 步態決定因子, 姿勢, 重心, 壓力中心]
      - code: BASIC-KIN-ANALYSIS
        name: 人體動作技巧與分析（某個動作由哪條肌肉、哪種收縮型態完成）
        group: 肌動學與生物力學
        definition: 具體動作（伏地挺身、投擲、跳、游泳、懸吊訓練）由哪些肌肉、哪種收縮型態完成；肌電圖與動作捕捉分析。
        excludes:
          - 收縮本身的機制 → BASIC-PHY-MSK
        keywords: [動作分析, 收縮型態, 肌電圖, 動作捕捉, 跑, 跳, 投擲, 伏地挺身]
      - code: BASIC-KIN-TISSUE
        name: 組織生物力學
        group: 肌動學與生物力學
        definition: 骨、肌腱、韌帶、軟骨的力學特性：應力應變、黏彈性、潛變、鬆弛。
        keywords: [應力應變, 黏彈性, 潛變, 骨, 肌腱, 韌帶, 軟骨]

  - code: INTRO
    name: 物理治療學概論
    full_name: 物理治療學概論（包括物理治療史、物理治療倫理學與物理治療行政管理學）
    short_name: 概論
    topics:
      - code: INTRO-HISTORY
        name: 物理治療導論與歷史、教育、專業組織
        definition: 物理治療的歷史沿革、教育制度、專業發展，以及 WCPT、APTA、台灣物理治療學會等專業組織。
        keywords: [歷史沿革, WCPT, APTA, 台灣物理治療學會, 教育制度, 專業發展]
      - code: INTRO-PRACTICE
        name: 執業內涵與專業角色
        definition: 物理治療師的業務範圍、專業角色與自主、轉介與直接就醫、物理治療診斷的意義。
        excludes:
          - 法條本身、罰則 → INTRO-LAW
        keywords: [業務範圍, 物理治療師法第12條, 轉介, 直接就醫, 專業自主]
      - code: INTRO-ETHICS
        name: 物理治療倫理學
        definition: 倫理原則（自主、行善、不傷害、正義）、隱私、知情同意與代理決定、性別平等、跨文化照護。
        excludes:
          - 洩漏業務秘密的法律後果 → INTRO-LAW
        keywords: [倫理原則, 自主, 行善, 不傷害, 正義, 隱私, 知情同意, 性別平等, 跨文化]
      - code: INTRO-SAFETY
        name: 病人安全與案例分析
        definition: 病人安全、感染控制（含洗手時機）、跌倒預防、事件通報。
        excludes:
          - 醫療糾紛發生後怎麼處理、風險管理 → INTRO-ADMIN
        keywords: [病人安全, 感染控制, 跌倒預防, 事件通報]
      - code: INTRO-ADMIN
        name: 行政管理與管理學原理（含風險管理、醫療糾紛處理、空間與設施管理）
        definition: 管理功能、領導、品質管理、人力資源、財務、行銷；風險管理與醫療糾紛處理；治療空間規劃、設施與清潔消毒管理、無障礙就醫環境設計。
        excludes:
          - 物理治療所設置標準等有法規數字的規定 → INTRO-LAW
        keywords: [管理功能, 領導, 品質管理, 人力資源, 財務, 行銷, 風險管理, 醫療糾紛處理, 空間規劃, 設施管理, 無障礙環境設計, 清潔消毒管理]
      - code: INTRO-LAW
        name: 物理治療師法與相關法規（含醫療法律責任、設置標準）
        definition: 物理治療師法、醫療法、身心障礙者權益保障法、長照法與罰則；醫療法律責任（醫療過失、無過失責任、病歷的法律性質、業務秘密）；物理治療所設置標準。
        keywords: [物理治療師法, 醫療法, 身心障礙者權益保障法, 長照法, 罰則, 醫療過失, 無過失責任, 病歷法律性質, 業務秘密, 物理治療所設置標準]
      - code: INTRO-INSURANCE
        name: 健保與醫療政策、保險制度
        definition: 全民健保、支付制度（DRG、總額）、給付規定、長照 2.0。
        keywords: [全民健保, 支付制度, DRG, 總額, 長照2.0, 給付]
      - code: INTRO-EBP
        name: 實證物理治療與臨床推理
        definition: 實證五步驟、PICO、證據等級、系統性回顧與統合分析（meta-analysis）、臨床指引、臨床推理與目標設定。
        excludes:
          - 敏感度、特異度等診斷準確度的計算 → INTRO-STATS
          - 研究設計本身（如 N-of-1 試驗）→ INTRO-RESEARCH
        keywords: [實證五步驟, PICO, 證據等級, 系統性回顧, 統合分析, meta-analysis, 臨床推理, 指引]
      - code: INTRO-RESEARCH
        name: 研究方法
        definition: 研究設計、信度、效度、隨機分派、偏差、抽樣。
        keywords: [研究設計, 信度, 效度, 隨機分派, 偏差, 樣本]
      - code: INTRO-STATS
        name: 統計原理
        definition: 敘述統計、假設檢定、p 值、信賴區間、相關、迴歸、效應量，以及敏感度、特異度、預測值等診斷準確度。
        keywords: [敘述統計, 假設檢定, p值, 信賴區間, 相關, 迴歸, 效應量, 敏感度, 特異度, 預測值, 診斷準確度]
      - code: INTRO-MED
        name: 內外科概論（含生命徵象、傷口、功能評估等臨床基本知識）
        definition: 內外科疾病、藥理、影像、檢驗值，以及生命徵象、傷口分級、功能評估（Barthel 等）、人工關節等臨床基本知識。
        keywords: [內科疾病, 外科, 藥理, 影像, 檢驗值, 生命徵象, 傷口分級, 功能評估, Barthel, 人工關節]
      - code: INTRO-PH
        name: 公共衛生概論
        definition: 流行病學、三段五級預防、健康促進、衛生政策、發生率與盛行率。
        keywords: [流行病學, 三段五級預防, 健康促進, 衛生政策, 發生率, 盛行率]

  - code: TECH
    name: 物理治療技術學
    full_name: 物理治療技術學（包括電療學、熱療學、操作治療學與輔具學）
    short_name: 技術學
    topics:
      - code: TECH-ESTIM
        name: 電療因子（TENS、NMES、FES、干擾波、高壓直流、生物回饋、離子導入）
        group: 物理因子治療學
        definition: TENS、NMES、FES、干擾波、高壓間歇直流、肌電生物回饋、離子導入的原理、波形與參數。
        excludes:
          - 神經傳導、肌電圖等診斷用途 → TECH-EDX
        keywords: [TENS, NMES, FES, 干擾波, 高壓間歇直流, 肌電生物回饋, 離子導入, 波形, 參數]
      - code: TECH-EDX
        name: 電生理診斷
        group: 物理因子治療學
        definition: 神經傳導檢查、肌電圖、強度時間曲線、反應變性。
        keywords: [神經傳導, 肌電圖, 強度時間曲線, 反應變性]
      - code: TECH-THERMAL
        name: 淺層熱療與冷療
        group: 物理因子治療學
        definition: 熱敷、石蠟、紅外線、冰敷、冷噴的生理效應、劑量與禁忌症。
        excludes:
          - 短波、微波等深層透熱 → TECH-EMLIGHT
          - 超音波 → TECH-US
        keywords: [熱敷, 石蠟, 紅外線, 冰敷, 冷噴, 禁忌症]
      - code: TECH-US
        name: 超音波治療
        group: 物理因子治療學
        definition: 治療性超音波的頻率、強度、熱與非熱效應（空化）、音透。
        keywords: [超音波, 頻率, 強度, 空化, 音透, 相位]
      - code: TECH-HYDRO
        name: 水療
        group: 物理因子治療學
        definition: 浮力、靜水壓、渦流、水中運動與水療設備。
        keywords: [水療, 浮力, 靜水壓, 渦流, 水中運動]
      - code: TECH-EMLIGHT
        name: 電磁與光因子（雷射、紫外光、微波、短波）
        group: 物理因子治療學
        definition: 低能量雷射、紫外光、微波、短波透熱的原理與劑量。
        keywords: [低能量雷射, 紫外光, 微波, 短波透熱, 劑量]
      - code: TECH-MECH
        name: 力學因子（牽引、循環機、CPM）
        group: 物理因子治療學
        definition: 牽引、間歇性氣壓循環機、連續被動運動（CPM）的設定與適應症。
        keywords: [牽引, 間歇性氣壓, CPM, 重量, 角度]
      - code: TECH-SPECIAL
